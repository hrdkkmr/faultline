[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "faultline"
version = "0.1.0"
description = "Graph-native incident investigation and repair-intelligence agent on FalkorDB"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "falkordb==1.8.0",
  "fastapi==0.143.2",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "pydantic-settings==2.16.0",
  "pandas==3.0.6",
  "pyarrow==26.0.0",
  "huggingface_hub==2.2.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "ruff==0.14.0"]
llm = ["anthropic==1.15.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a running FalkorDB (docker compose up -d falkordb)",
]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
